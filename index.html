    <style>
      #gsv-instant-hero {
        display: none;
        position: relative;
        min-height: 760px;
        overflow: hidden;
        background: #030712;
      }
      .gsv-home-loading #gsv-instant-hero {
        display: block;
      }
      #gsv-instant-hero video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #gsv-instant-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(3, 7, 18, 0.88), rgba(3, 7, 18, 0.48), rgba(3, 7, 18, 0.18));
      }
    </style>
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/$/, "");
        document.documentElement.classList.toggle(
          "gsv-home-loading",
          path === "",
        );
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
